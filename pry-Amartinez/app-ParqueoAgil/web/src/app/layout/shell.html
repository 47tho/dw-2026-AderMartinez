<a class="skip" href="#contenido">Saltar al contenido</a>

<aside class="sidebar">
  <div class="brand">
    <span class="logo" aria-hidden="true">P</span>
    <div>
      <strong>ParqueoÁgil</strong>
      <span class="subtle">Panel del parqueadero</span>
    </div>
  </div>

  <nav aria-label="Secciones">
    @for (item of nav(); track item.path) {
      <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path [attr.d]="item.icon" fill="currentColor" /></svg>
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="account">
    <div class="live" [class.on]="live.status() === 'live'" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>{{ statusLabel() }}
    </div>
    @if (auth.profile(); as user) {
      <div class="user">
        <span class="avatar" aria-hidden="true">{{ user.username.charAt(0).toUpperCase() }}</span>
        <div class="who">
          <strong>{{ user.username }}</strong>
          <span class="subtle">{{ user.email }}</span>
        </div>
      </div>
    }
    <button type="button" class="btn sm ghost" (click)="logout()">Cerrar sesión</button>
  </div>
</aside>

<main id="contenido" tabindex="-1">
  <router-outlet />
</main>
